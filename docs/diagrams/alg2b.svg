<rect x="295.0" y="826.5" width="250" height="91.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="851.4" text-anchor="middle" font-size="15">итог := итог + цена;</text>
<text x="420" y="868.6" text-anchor="middle" font-size="15">записать заявку (100 %);</text>
<text x="420" y="885.9" text-anchor="middle" font-size="15">состояние := «Аннулирован»;</text>
