<text x="420" y="109.2" text-anchor="middle" font-size="15">Начало</text>
<polygon points="311.0,202.0 545.0,202.0 529.0,262.0 295.0,262.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="228.6" text-anchor="middle" font-size="15">Ввод: билет, мероприятие,</text>
<text x="420" y="245.9" text-anchor="middle" font-size="15">заявитель, время now</text>
<polygon points="420,310.0 560.0,360.0 420,410.0 280.0,360.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="356.6" text-anchor="middle" font-size="15">Билет относится</text>
<text x="420" y="373.9" text-anchor="middle" font-size="15">к мероприятию?</text>
<polygon points="420,438.0 560.0,488.0 420,538.0 280.0,488.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="484.6" text-anchor="middle" font-size="15">Заявитель —</text>
<text x="420" y="501.9" text-anchor="middle" font-size="15">покупатель?</text>
<polygon points="420,566.0 560.0,616.0 420,666.0 280.0,616.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="604.0" text-anchor="middle" font-size="15">Билет «Оплачен»,</text>
<text x="420" y="621.2" text-anchor="middle" font-size="15">не отменено,</text>
<text x="420" y="638.5" text-anchor="middle" font-size="15">now &lt; начала?</text>
<rect x="295.0" y="713.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="749.2" text-anchor="middle" font-size="15">Δ := начало − now</text>
<polygon points="420,822.0 560.0,872.0 420,922.0 280.0,872.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="877.2" text-anchor="middle" font-size="15">Δ ≥ 10 сут?</text>
<polygon points="420,950.0 560.0,1000.0 420,1050.0 280.0,1000.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="1005.2" text-anchor="middle" font-size="15">Δ ≥ 5 сут?</text>
<polygon points="420,1078.0 560.0,1128.0 420,1178.0 280.0,1128.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="1133.2" text-anchor="middle" font-size="15">Δ ≥ 3 сут?</text>
<rect x="605.0" y="841.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="730" y="877.2" text-anchor="middle" font-size="15">p := 100</text>
<rect x="605.0" y="969.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="730" y="1005.2" text-anchor="middle" font-size="15">p := 50</text>
<rect x="605.0" y="1097.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="730" y="1133.2" text-anchor="middle" font-size="15">p := 30</text>
<rect x="295.0" y="1219.125" width="250" height="73.75" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="1244.0" text-anchor="middle" font-size="15">сумма := цена · p / 100;</text>
<text x="420" y="1261.2" text-anchor="middle" font-size="15">записать заявку: время,</text>
<text x="420" y="1278.5" text-anchor="middle" font-size="15">основание, p, сумма</text>
<rect x="295.0" y="1353.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="1380.6" text-anchor="middle" font-size="15">состояние := «Возвращён»;</text>
<text x="420" y="1397.9" text-anchor="middle" font-size="15">записать переход</text>
<polygon points="311.0,1482.0 545.0,1482.0 529.0,1542.0 295.0,1542.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="420" y="1517.2" text-anchor="middle" font-size="15">Вывод: сумма возврата</text>
<rect x="5.0" y="1353.0" width="250" height="62" fill="white" stroke="black" stroke-width="1.3"/>
<text x="130" y="1380.6" text-anchor="middle" font-size="15">Записать заявку:</text>
<text x="130" y="1397.9" text-anchor="middle" font-size="15">отказ и его причина</text>
<polygon points="21.0,1482.0 255.0,1482.0 239.0,1542.0 5.0,1542.0" fill="white" stroke="black" stroke-width="1.3"/>
<text x="130" y="1508.6" text-anchor="middle" font-size="15">Вывод: в возврате</text>
<text x="130" y="1525.9" text-anchor="middle" font-size="15">отказано</text>
